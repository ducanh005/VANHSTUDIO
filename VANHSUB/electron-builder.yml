appId: com.vanhstudio.app
productName: VanhStudio
copyright: Copyright © 2026 VanhStudio
directories:
    output: dist
    buildResources: resources
files:
    - from: .
      filter:
          - package.json
          - app
# tesseract.js nạp worker-script và wasm từ file thật trên đĩa — không đọc được
# từ trong asar nên phải giải nén node_modules của nó ra app.asar.unpacked.
# Tương tự với binary ffmpeg/ffprobe (@ffmpeg-installer, @ffprobe-installer)
# và whisper.cpp (nodejs-whisper) — binary whisper-cli không thể chạy từ asar.
asarUnpack:
    - node_modules/tesseract.js/**
    - node_modules/tesseract.js-core/**
    - node_modules/@ffmpeg-installer/**
    - node_modules/@ffprobe-installer/**
    - node_modules/nodejs-whisper/**
# Sidecar Python PaddleOCR (rapidocr) — spawn bằng đường dẫn thật trên đĩa
extraResources:
    - from: extension
      to: extension
      filter:
          - "*.js"
          - "*.json"
          - "*.html"
          - "*.css"
          - README.md
    - from: node_modules/nodejs-whisper/cpp/whisper.cpp/build/bin/Release
      to: whisper
      filter:
          - whisper-cli.exe
          - "*.dll"
    - from: main/ocr/paddle
      to: paddle
      filter:
          - paddle_server.py
    - from: main/asr/python
      to: asr
      filter:
          - faster_whisper_server.py
publish: null
